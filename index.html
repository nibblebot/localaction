<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f5f3fa" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Font boot: only the active font is ever fetched. Applies the persisted
         font before first paint and preloads exactly that file; other fonts
         load on demand via their lazy @font-face when the user switches.
         STORAGE_KEY/font ids must stay in sync with
         src/components/appearance/AppearanceProvider.tsx. -->
    <script>
      (function () {
        var FONT_FILES = {
          jakarta: 'PlusJakartaSans',
          plex: 'IBMPlexSans',
          general: 'GeneralSans',
          manrope: 'Manrope',
          dm: 'DMSans',
        };
        var font = 'dm';
        try {
          var stored = JSON.parse(
            localStorage.getItem('localaction.appearance.v1') || '{}',
          );
          if (stored && typeof stored.font === 'string' && FONT_FILES[stored.font]) {
            font = stored.font;
          }
        } catch {
          // localStorage unavailable or corrupt — fall back to the default.
        }
        document.documentElement.setAttribute('data-la-font', font);
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'font';
        link.type = 'font/woff2';
        link.crossOrigin = 'anonymous';
        link.href = '/fonts/' + FONT_FILES[font] + '-Variable.woff2';
        document.head.appendChild(link);
      })();
    </script>
    <!-- interactive-widget=resizes-content: the layout viewport shrinks when
         the virtual keyboard opens, so focused inputs are never covered. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>localaction</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
