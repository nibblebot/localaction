<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Icon system: one 20x20 grid, 1.5px stroke, round caps/joins.
       Artwork covers ~60-70% of the canvas so every icon reads at the
       same optical size for a given render size. Exception: close-icon
       keeps wider margins (10x10 artwork) so it reads as "dismiss",
       not as a heavy slash, at chip scale. The brand wordmark keeps
       its own 24 grid. -->
  <symbol id="leaf-icon" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="2.5" fill="currentColor"/>
  </symbol>
  <symbol id="area-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" d="M10 3 L17 10 L10 17 L3 10 Z"/>
  </symbol>
  <symbol id="project-icon" viewBox="0 0 20 20">
    <rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
  <symbol id="add-project-icon" viewBox="0 0 20 20">
    <rect x="4" y="4" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 7.5 V12.5 M7.5 10 H12.5"/>
  </symbol>
  <symbol id="add-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 4 V16 M4 10 H16"/>
  </symbol>

  <!-- Chrome -->
  <symbol id="menu-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 6 H17 M3 10 H17 M3 14 H17"/>
  </symbol>
  <symbol id="search-icon" viewBox="0 0 20 20">
    <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M13 13 L17 17"/>
  </symbol>
  <symbol id="filter-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 5 H17 M5 10 H15 M8 15 H12"/>
  </symbol>
  <symbol id="tag-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M3 3 H9 L17 11 L11 17 L3 9 Z"/>
    <circle cx="6.5" cy="6.5" r="1.2" fill="currentColor"/>
  </symbol>
  <symbol id="home-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M3 10 L10 3 L17 10 V17 H12 V12 H8 V17 H3 Z"/>
  </symbol>
  <symbol id="areas-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" d="M10 3 L17 7 L10 11 L3 7 Z M3 7 V13 L10 17 L17 13 V7"/>
  </symbol>
  <symbol id="notes-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M5 3 H13 L17 7 V17 H5 Z"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M8 10 H14 M8 13 H14 M8 7 H11"/>
  </symbol>
  <symbol id="settings-icon" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 2 V4 M10 16 V18 M2 10 H4 M16 10 H18 M4.2 4.2 L5.6 5.6 M14.4 14.4 L15.8 15.8 M4.2 15.8 L5.6 14.4 M14.4 5.6 L15.8 4.2"/>
  </symbol>
  <symbol id="more-icon" viewBox="0 0 20 20">
    <circle cx="5" cy="10" r="1.4" fill="currentColor"/>
    <circle cx="10" cy="10" r="1.4" fill="currentColor"/>
    <circle cx="15" cy="10" r="1.4" fill="currentColor"/>
  </symbol>
  <symbol id="lock-icon" viewBox="0 0 20 20">
    <rect x="4" y="9" width="12" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" d="M6.5 9 V6.5 a3.5 3.5 0 0 1 7 0 V9"/>
  </symbol>
  <symbol id="chevron-down-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 7.5 L10 13.5 L16 7.5"/>
  </symbol>
  <symbol id="chevron-right-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M7.5 4 L13.5 10 L7.5 16"/>
  </symbol>
  <symbol id="chevron-left-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M12.5 4 L6.5 10 L12.5 16"/>
  </symbol>
  <symbol id="calendar-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M4 5 H16 V16 H4 Z M4 8.5 H16 M7.5 3 V6 M12.5 3 V6"/>
  </symbol>
  <symbol id="close-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M5 5 L15 15 M15 5 L5 15"/>
  </symbol>
  <symbol id="trash-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M4 6 H16 M8 6 V4 H12 V6 M6 6 L7 17 H13 L14 6"/>
  </symbol>
  <symbol id="restore-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 10 a6 6 0 1 0 1.8 -4.2 M4 4 V7 H7"/>
  </symbol>
  <!-- Clockwise counterpart of restore-icon (sync retry). -->
  <symbol id="retry-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M16 10 a6 6 0 1 1 -1.8 -4.2 M16 4 V7 H13"/>
  </symbol>
  <symbol id="check-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M4 10.5 L8.5 15 L16 6"/>
  </symbol>
  <symbol id="sort-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M5 4 V16 M5 4 L3 6 M5 4 L7 6 M11 4 L17 4 M11 9 L15 9 M11 14 L13 14"/>
  </symbol>
  <!-- Drag grip: 2x3 dots, symmetric about both axes, even spacing. -->
  <symbol id="drag-icon" viewBox="0 0 20 20">
    <circle cx="7.5" cy="5.5" r="1.4" fill="currentColor"/>
    <circle cx="12.5" cy="5.5" r="1.4" fill="currentColor"/>
    <circle cx="7.5" cy="10" r="1.4" fill="currentColor"/>
    <circle cx="12.5" cy="10" r="1.4" fill="currentColor"/>
    <circle cx="7.5" cy="14.5" r="1.4" fill="currentColor"/>
    <circle cx="12.5" cy="14.5" r="1.4" fill="currentColor"/>
  </symbol>
  <!-- Section-row drag grip: the § glyph outline from Plus Jakarta Sans
       (the UI font), normalized into the 20x20 icon box. The semantic
       "section" mark doubles as the grip; tasks keep the dot grip. -->
  <symbol id="section-drag-icon" viewBox="0 0 20 20">
    <path fill="currentColor" d="M10.24 16.8Q8.94 16.8 7.98 16.16Q7.03 15.51 6.61 14.4L7.63 13.91Q8.03 14.73 8.71 15.21Q9.4 15.7 10.24 15.7Q11.04 15.7 11.59 15.29Q12.15 14.89 12.15 14.26Q12.15 13.8 11.89 13.53Q11.64 13.25 11.29 13.09Q10.93 12.93 10.65 12.86L9.35 12.48Q8.14 12.11 7.59 11.49Q7.03 10.87 7.03 10.05Q7.03 9.27 7.44 8.7Q7.84 8.12 8.52 7.8Q9.2 7.48 10.02 7.48L9.97 8.26Q9.21 8.26 8.76 8.7Q8.3 9.13 8.3 9.79Q8.3 10.28 8.53 10.58Q8.75 10.88 9.06 11.04Q9.37 11.2 9.62 11.28L11.1 11.72Q12.18 12.04 12.79 12.7Q13.39 13.36 13.39 14.26Q13.39 14.99 12.99 15.57Q12.59 16.14 11.88 16.47Q11.17 16.8 10.24 16.8ZM10.24 12.52V11.74Q11.04 11.74 11.59 11.29Q12.15 10.85 12.15 10.14Q12.15 9.64 11.89 9.33Q11.64 9.02 11.29 8.84Q10.93 8.66 10.65 8.58L9.35 8.2Q8.14 7.84 7.59 7.21Q7.03 6.59 7.03 5.77Q7.03 5 7.44 4.42Q7.84 3.85 8.52 3.53Q9.2 3.2 10.02 3.2Q11.14 3.2 12.05 3.79Q12.97 4.38 13.34 5.41L12.32 5.9Q11.97 5.16 11.35 4.73Q10.73 4.3 9.97 4.3Q9.21 4.3 8.76 4.69Q8.3 5.08 8.3 5.68Q8.3 6.12 8.53 6.39Q8.75 6.66 9.06 6.79Q9.37 6.92 9.62 7L11.1 7.44Q12.18 7.76 12.79 8.42Q13.39 9.08 13.39 9.98Q13.39 10.71 12.99 11.29Q12.59 11.86 11.88 12.19Q11.17 12.52 10.24 12.52Z"/>
  </symbol>
  <!-- Sections toggle: two short header bars, each followed by an
       indented task line. Toggles empty-section visibility on a
       project row. -->
  <symbol id="sections-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 4 H12 M6 8 H17 M3 12 H12 M6 16 H17"/>
  </symbol>
  <symbol id="add-section-icon" viewBox="0 0 20 20">
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 5 H12 M6 9 H15 M3 13 H9 M13.5 11 V17 M10.5 14 H16.5"/>
  </symbol>
  <symbol id="palette-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M10 3 a7 7 0 1 0 0 14 a2 2 0 0 0 2 -2 v-1 a2 2 0 0 1 2 -2 h1 a2 2 0 0 0 2 -2 a7 7 0 0 0 -7 -7 Z"/>
    <circle cx="7.5" cy="9.5" r="1" fill="currentColor"/>
    <circle cx="11" cy="7" r="1" fill="currentColor"/>
    <circle cx="14" cy="9.5" r="1" fill="currentColor"/>
    <circle cx="13" cy="13" r="1" fill="currentColor"/>
  </symbol>

  <!-- Document with list rows (project header glyph) -->
  <symbol id="project-list-icon" viewBox="0 0 20 20">
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M5 3 H12 L16 7 V17 H5 Z"/>
    <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" d="M12 3 V7 H16"/>
    <circle cx="7.5" cy="11" r="0.9" fill="currentColor"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 11 H13.5"/>
    <circle cx="7.5" cy="14" r="0.9" fill="currentColor"/>
    <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10 14 H13.5"/>
  </symbol>
  <!-- Brand wordmark -->
  <symbol id="memos-mark-icon" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor"/>
    <path fill="var(--bg, #f6efe5)" d="M8 8 H10 V12.5 L14 8 H16.5 L12 12.5 L17 17 H14.2 L10 13.2 V17 H8 Z"/>
  </symbol>
</svg>
